[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Pre-rendered routes are served as static files. This is only a last-resort
# fallback for unknown paths, pointing at the pre-rendered 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
